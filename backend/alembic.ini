# Alembic configuration.
#
# NOTE: this file must stay pure ASCII. Alembic reads it with the system locale
# encoding (GBK on Chinese Windows), so UTF-8 Chinese comments break the parser.
#
# The database URL is intentionally NOT set here: alembic/env.py reads it from
# app.core.config.Settings, so the app and the migration tool always point at
# the same database. Putting it in two places is how "changed .env but forgot
# alembic.ini" incidents happen.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
