# ============================================================
# CI：静态检查 + 迁移 + 全量测试 + 镜像构建
#
# 测试是「真连库」的：MySQL / Redis / MinIO 都用 services 起真容器。
# mock 掉数据库的测试只能证明代码能跑，证明不了 SQL 写对了。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续推送时取消上一次，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 services 里声明的账号保持一致
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: blog_v2

jobs:
  quality:
    name: 静态检查与测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blog_v2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=40s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

      # 图片上传的用例需要真实对象存储；不起的话它们会 skip，
      # 但既然能起，就让测试跑完整
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # 覆盖 config.yaml 的默认值，指向 services 容器。
      # 双下划线表示配置层级
      APP__MODE: release
      DATABASE__MYSQL__HOST: 127.0.0.1
      DATABASE__MYSQL__PORT: "3306"
      DATABASE__MYSQL__USER: root
      DATABASE__MYSQL__PASSWORD: root
      DATABASE__MYSQL__DATABASE: blog_v2
      DATABASE__REDIS__ENABLED: "true"
      DATABASE__REDIS__HOST: 127.0.0.1
      DATABASE__REDIS__PORT: "6379"
      MINIO__ENDPOINT: 127.0.0.1:9000
      MINIO__ACCESS_KEY: minioadmin
      MINIO__SECRET_KEY: minioadmin
      MINIO__PUBLIC_URL: http://127.0.0.1:9000
      JWT__SECRET: ci-only-secret-not-for-production
      ADMIN__ACCOUNT: "00000000000"
      ADMIN__PASSWORD: ci-admin-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 静态检查
        run: ruff check app tests alembic scripts

      - name: 格式检查
        run: ruff format --check app tests alembic scripts

      - name: 建表
        run: alembic upgrade head

      - name: 契约校对
        # 文档与代码的接口清单必须一致，缺一条就红
        run: python scripts/check_api_contract.py

      - name: 全量测试
        run: pytest tests/ -q

  docker:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # 只验证能构建成功，不推仓库（部署由 ECS 侧拉取构建）
          tags: blog-v2-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
